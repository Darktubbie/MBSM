<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MBSM</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    // GitHub Pages has no real server-side routing: it serves this file
    // whenever a URL doesn't match an actual file. Since MBSM is a
    // single-page app, that includes every one of its "tool" URLs
    // (e.g. /MBSM/Validator/) whenever they're opened directly or
    // refreshed. This script works out the real index.html location,
    // remembers exactly which page was requested, and bounces there so
    // app.js's own router can restore the right tab/tool from it.
    //
    // Keep this segment list in sync with the ROUTES array in app.js.
    var KNOWN_SEGMENTS = ["4D-5D-Viewer", "Classic-Skins", "Validator", "Maker", "Obj-Skin", "About"];

    // Fallback for when NONE of the segments above match -- i.e. a typo'd
    // or otherwise invalid URL (e.g. "/MBSM/validatos/"). How many leading
    // path segments make up the site's own base directory, independent of
    // MBSM's routes: 1 for a typical GitHub Pages project site
    // ("<user>.github.io/MBSM/..."), 0 if MBSM is hosted at a domain's
    // root. Adjust this if you fork/self-host MBSM somewhere else.
    var BASE_SEGMENTS_FALLBACK = 1;

    var path = window.location.pathname;
    var matchedKnown = false;
    for (var i = 0; i < KNOWN_SEGMENTS.length; i++) {
      var re = new RegExp("/" + KNOWN_SEGMENTS[i] + "/?$", "i");
      if (re.test(path)) {
        path = path.replace(re, "/");
        matchedKnown = true;
        break;
      }
    }

    if (matchedKnown) {
      if (!/\/$/.test(path)) {
        path = path.replace(/[^/]*$/, "");
      }
    } else {
      // Nothing matched -- do NOT try to guess a base path out of the
      // leftover segment(s). That's exactly what used to send this page
      // in circles: redirecting "/MBSM/validatos/" to
      // "/MBSM/validatos/index.html" (which doesn't exist either, so
      // GitHub Pages serves 404.html again, forever). Collapse straight to
      // the site's own base directory instead.
      var segments = path.split("/").filter(Boolean);
      path = "/" + segments.slice(0, BASE_SEGMENTS_FALLBACK).join("/");
      if (path !== "/") path += "/";
    }

    var target = path + "index.html";

    // Belt-and-suspenders loop guard: if we're somehow about to redirect
    // to the exact target we just tried, stop and go to the domain root
    // instead of possibly looping forever.
    try {
      if (sessionStorage.getItem("mbsm_404_last_target") === target) {
        sessionStorage.removeItem("mbsm_404_last_target");
        target = "/";
      } else {
        sessionStorage.setItem("mbsm_404_last_target", target);
      }
    } catch (e) {}

    try {
      sessionStorage.setItem(
        "mbsm_redirect_path",
        window.location.pathname + window.location.search + window.location.hash
      );
    } catch (e) {}

    window.location.replace(target);
  })();
</script>
</head>
<body>
  <p>Redirecting to <a href="index.html">MBSM</a>&hellip;</p>
</body>
</html>
